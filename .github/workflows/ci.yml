name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          nix develop --command git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$GITHUB_REF_NAME" = "v$(nix eval --raw .#packages.x86_64-linux.default.version)"
      - name: Build, test, and check formatting
        run: nix flake check --show-trace
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc
        run: nix develop --command env RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --no-deps
