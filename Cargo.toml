[workspace]
members = ["crates/rstml-ssr", "crates/rstml-ssr-macros"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = ["crates-io"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ethanthoma/rstml-ssr"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
collapsible_if = "allow"
